model:
  n_factors: 4
  n_regimes: 2
  # Order matters and is validated at construction: regimes are sorted by
  # ascending mean, so the lowest-mean (recession) state must come first.
  # The reverse order silently inverts the recession probability.
  regime_labels:
    - recession
    - expansion
  factor_names:
    - real_activity
    - labor_market
    - inflation
    - financial_stress
  em_max_iter: 200
  em_tol: 1.0e-6
  kalman:
    initial_state_mean: 0.0
    initial_state_cov: 1.0

  # Ensemble recession detection
  #
  # Weights set from a 105-point quarterly walk-forward (2000-2026), each
  # point a separate refit scored against NBER. Measured out-of-sample:
  #
  #   configuration                              AUC     Brier
  #   rsm .20 / probit .40 / cfnai .20 / sahm .20  0.965  0.0842
  #   drop rsm, renormalise                        0.966  0.0554
  #   cfnai .50 / probit .375 / sahm .125          0.969  0.0514   <- this
  #   CFNAI signal alone                           0.964  0.0569
  #
  # A constant forecast at the 8.6% base rate scores Brier 0.0784, so the
  # previous weights were worse calibrated than predicting nothing. AUC
  # barely moves between these; the gain is entirely in calibration, which
  # is what matters when the probability is consumed as a feature.
  ensemble:
    enabled: true
    weights:
      # Zero, not removed: the Markov-switching model is retained and still
      # published in ensemble_detail, but it is latched (>0.99 in 54 of 105
      # real-time quarters, including deep expansions; AUC 0.600, Brier
      # 0.574) and at any positive weight it degrades the ensemble's
      # calibration. Restore a weight once the latching is diagnosed.
      rsm: 0.0
      probit: 0.375     # Supervised; strongest single learned signal
      cfnai: 0.50       # Chicago Fed coincident index — best standalone
      sahm: 0.125       # Unemployment-based; correlated with the above
    probit:
      add_lags: 3
      regularization: 1.0
      class_balanced: true
      extra_features:
        - CFNAI
        - T10Y2Y
        - BAA10Y

allocation:
  regime_conditional_weights:
    expansion:
      equities: 0.60
      bonds: 0.20
      commodities: 0.15
      cash: 0.05
    recession:
      equities: 0.15
      bonds: 0.50
      commodities: 0.05
      cash: 0.30

data:
  fred_api_base_url: "https://api.stlouisfed.org/fred"
  cache_dir: "data/cache"
  database_path: "data/nowcaster.duckdb"
  start_date: "1980-01-01"
  vintage_dir: "data/vintages"

agent:
  llm_model: "gpt-4o-mini"
  temperature: 0.3
  max_tokens: 1500
  system_prompt_path: "config/prompts/macro_analyst_system.txt"

dashboard:
  title: "Macro Regime Nowcaster"
  refresh_interval: 3600
  chart_theme: "plotly_dark"
  recession_shading: true
