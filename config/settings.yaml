model:
  # 5 is the smallest K at which every factor has an evidenced name;
  # see Nowcaster.DEFAULT_FACTOR_NAMES for the measured qualities.
  n_factors: 5
  n_regimes: 2
  # Order matters and is validated at construction: regimes are sorted by
  # ascending mean, so the lowest-mean (recession) state must come first.
  # The reverse order silently inverts the recession probability.
  regime_labels:
    - recession
    - expansion
  factor_names:
    - real_activity
    - inflation
    - financial_stress
    - yield_curve
    - long_rates
  em_max_iter: 200
  em_tol: 1.0e-6
  kalman:
    initial_state_mean: 0.0
    initial_state_cov: 1.0

  # Ensemble recession detection
  #
  # Weights set from a 434-point monthly walk-forward (1990-2026) covering
  # four recessions, each point a separate refit scored against NBER.
  # Measured out-of-sample:
  #
  #   configuration                              AUC     Brier
  #   cfnai .50 / probit .375 / sahm .125          0.944  0.0544   <- this
  #   ...with rsm at .10                           0.931  0.0609
  #   ...with rsm at .20                           0.924  0.0736
  #   CFNAI signal alone                           0.947  0.0521
  #
  # A constant forecast at the 8.3% base rate scores Brier 0.0761. Note
  # the CFNAI signal alone still edges out the full ensemble: the factor
  # machinery is not earning its keep as a standalone detector, only as a
  # partly-independent second read. See README, Measured Real-Time
  # Performance.
  ensemble:
    enabled: true
    weights:
      # Zero, not removed: the Markov-switching model is retained and still
      # published in ensemble_detail. The regime-ordering bug behind its
      # latching is fixed (AUC 0.600 -> 0.714, latching 51% -> 35% of
      # months), but it still reports 42.5% recession probability during
      # expansions and degrades the ensemble at any positive weight.
      rsm: 0.0        # latched during expansions; see nowcaster.py
      probit: 0.50    # yield curve + credit spreads + DFM factors
      cfnai: 0.50     # Chicago Fed coincident index
      sahm: 0.0       # correlated with the above; no marginal value at h=0
    probit:
      add_lags: 3
      regularization: 1.0
      class_balanced: true
      extra_features:
        - CFNAI
        - T10Y2Y
        - BAA10Y

allocation:
  regime_conditional_weights:
    expansion:
      equities: 0.60
      bonds: 0.20
      commodities: 0.15
      cash: 0.05
    recession:
      equities: 0.15
      bonds: 0.50
      commodities: 0.05
      cash: 0.30

data:
  fred_api_base_url: "https://api.stlouisfed.org/fred"
  cache_dir: "data/cache"
  database_path: "data/nowcaster.duckdb"
  start_date: "1980-01-01"
  vintage_dir: "data/vintages"

agent:
  llm_model: "gpt-4o-mini"
  temperature: 0.3
  max_tokens: 1500
  system_prompt_path: "config/prompts/macro_analyst_system.txt"

dashboard:
  title: "Macro Regime Nowcaster"
  refresh_interval: 3600
  chart_theme: "plotly_dark"
  recession_shading: true
