  # the main leading-indicator gap in the panel.
  - code: BACTSAMFRBDAL
    name: Dallas Fed Manufacturing General Business Activity Diffusion Index
    frequency: monthly
    category: production_activity
    transform: none
    publication_lag_days: 1

  - code: CFNAIDIFF
    name: CFNAI Diffusion Index
    frequency: monthly
    category: production_activity
    transform: none
    publication_lag_days: 24

  - code: DMANEMP
    name: Manufacturing Employment
    frequency: monthly
    category: production_activity
    transform: log_diff
    publication_lag_days: 35

  # Financial Conditions
