  - code: SP500
    name: S&P 500
    frequency: daily
    category: financial_conditions
    transform: log_diff
    publication_lag_days: 1

  - code: NFCI
    name: Chicago Fed National Financial Conditions Index
    frequency: weekly
    category: financial_conditions
    transform: none
    publication_lag_days: 5

  - code: STLFSI2
    name: St. Louis Fed Financial Stress Index
    frequency: weekly
    category: financial_conditions
