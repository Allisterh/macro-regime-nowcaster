  # NOTE: TEDRATE was discontinued in January 2022 with the LIBOR
  # transition, so it contributes only NaN at the panel edge.  Retained
  # for historical coverage pre-2022; BAMLH0A0HYM2 below is the live
  # replacement for credit-stress signal.
  - code: TEDRATE
    name: TED Spread (discontinued 2022)
    frequency: daily
    category: financial_conditions
    transform: none
    publication_lag_days: 1

  - code: BAMLH0A0HYM2
    name: ICE BofA US High Yield Index Option-Adjusted Spread
    frequency: daily
    category: financial_conditions
    transform: none
    publication_lag_days: 1

  - code: ANFCI
    name: Chicago Fed Adjusted National Financial Conditions Index
    frequency: weekly
    category: financial_conditions
    transform: none
    publication_lag_days: 5


  # Long-history yield components.  FRED's ready-made spreads T10Y3M and
  # BAA10Y only start in 1982 and 1986, which caps any backtest at four
  # recessions — and they are exactly the leading block the probit needs.
  # These monthly constituents go back decades further, so the spreads are
  # reconstructed by subtraction in `derived_series` below.
  - code: GS10
    name: 10-Year Treasury Constant Maturity Rate (monthly, from 1953)
    frequency: monthly
    category: financial_conditions
    transform: none
    publication_lag_days: 1

  - code: TB3MS
    name: 3-Month Treasury Bill Secondary Market Rate (monthly, from 1934)
    frequency: monthly
    category: financial_conditions
    transform: none
    publication_lag_days: 1

  - code: BAA
    name: Moody's Seasoned Baa Corporate Bond Yield (from 1919)
    frequency: monthly
    category: financial_conditions
    transform: none
    publication_lag_days: 1

  - code: AAA
    name: Moody's Seasoned Aaa Corporate Bond Yield (from 1919)
    frequency: monthly
    category: financial_conditions
    transform: none
    publication_lag_days: 1

