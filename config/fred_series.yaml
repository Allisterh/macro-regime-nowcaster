# ---------------------------------------------------------------------------
# Derived series
# ---------------------------------------------------------------------------
# Spreads computed from the long-history components above, so the
# leading-indicator block reaches back to the 1950s rather than the 1980s.
# This is what lets the walk-forward cover nine recessions instead of four,
# which is the binding constraint on every confidence interval this project
# reports.  Each entry is `minuend - subtrahend`; both must be in `series`.
derived_series:
  - code: TERM_SPREAD
    name: Term spread, 10-Year Treasury minus 3-Month Bill (from 1953)
    minuend: GS10
    subtrahend: TB3MS
    transform: none
    publication_lag_days: 1

  - code: CREDIT_SPREAD
    name: Credit spread, Moody's Baa minus Aaa (from 1919)
    minuend: BAA
    subtrahend: AAA
    transform: none
    publication_lag_days: 1

# ---------------------------------------------------------------------------
# Recession-sensitive series
# ---------------------------------------------------------------------------
# Subset of series particularly informative for detecting business-cycle
# turning points.  Used by the probit model and curated regime composite.
recession_sensitive_series:
  # Labor market (coincident / lagging)
  - PAYEMS        # Nonfarm payrolls — core coincident indicator
  - ICSA          # Initial claims — leading indicator
  - UNRATE        # Unemployment rate — lagging, high signal-to-noise
  - AWHMAN        # Avg weekly hours, manufacturing — leading
  - IC4WSA        # 4-week MA initial claims — smoother leading signal
  - TEMPHELPS     # Temporary help services — canonical labor leading indicator
  - AWHAETP       # Average weekly hours, total private — hours fall before headcount
  # Production & activity (coincident)
  - INDPRO        # Industrial production
  - TCU           # Capacity utilisation
  - CFNAI         # Chicago Fed National Activity Index — purpose-built
  - W875RX1       # Real personal income ex-transfers
  - RSXFS         # Retail sales
  # Production & surveys (leading)
  - WEI           # Weekly Economic Index — purpose-built for nowcasting
  - USSLIND       # Leading Index for the US
  - JTSQUR        # Quits rate — turns before openings and payrolls
  # Financial conditions (leading)
  - T10Y2Y        # 10Y−2Y yield spread — best single leading indicator
  - T10Y3M        # 10Y−3M yield spread — alternative yield curve measure
  - BAA10Y        # BAA credit spread — widens before recessions
  - BAMLH0A0HYM2  # HY option-adjusted spread — earlier and cleaner than BAA10Y
  - TERM_SPREAD   # 10Y-3M, reconstructed back to 1953
  - CREDIT_SPREAD # Baa-Aaa, reconstructed back to 1919
  - NFCI          # Financial conditions index
  - VIXCLS        # VIX — fear gauge
  # Credit conditions (leading, ~6-month lead)
  - DRTSCILM      # Bank lending standards — tightening precedes recessions
  - DRALACBN      # Delinquency rate — rises before recessions
  # Consumer & housing (leading)
  - UMCSENT       # Consumer sentiment
  - PERMIT        # Building permits
  - HOUST         # Housing starts
  - MORTGAGE30US  # 30-year mortgage rate — housing demand leading indicator
  - CSUSHPISA     # Case-Shiller home prices — wealth-effect channel
