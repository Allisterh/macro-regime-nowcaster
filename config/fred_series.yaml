# FRED Series Catalog
# Fields: code, name, frequency, category, transform, publication_lag_days
series:

  # Labor Market
  - code: PAYEMS
    name: Total Nonfarm Payrolls
    frequency: monthly
    category: labor_market
    transform: diff
    publication_lag_days: 35

  - code: ICSA
    name: Initial Claims for Unemployment Insurance
    frequency: weekly
    category: labor_market
    transform: log_diff
    publication_lag_days: 5

  - code: CCSA
    name: Continued Claims for Unemployment Insurance
    frequency: weekly
    category: labor_market
    transform: log_diff
    publication_lag_days: 12

  - code: UNRATE
    name: Civilian Unemployment Rate
    frequency: monthly
    category: labor_market
    transform: diff
    publication_lag_days: 35

  - code: JTSJOL
    name: Job Openings Total Nonfarm
    frequency: monthly
    category: labor_market
    transform: log_diff
    publication_lag_days: 40

  # Quits lead hiring and wages: workers stop quitting before firms stop
  # hiring, so this turns earlier than openings.
  - code: JTSQUR
    name: Quits Rate Total Nonfarm
    frequency: monthly
    category: labor_market
    transform: diff
    publication_lag_days: 40

  - code: CES0500000003
    name: Average Hourly Earnings of All Employees
    frequency: monthly
    category: labor_market
    transform: log_diff
    publication_lag_days: 35

  - code: AWHMAN
    name: Average Weekly Hours of Production and Nonsupervisory Employees Manufacturing
    frequency: monthly
    category: labor_market
    transform: diff
    publication_lag_days: 35

  - code: CIVPART
    name: Labor Force Participation Rate
    frequency: monthly
    category: labor_market
    transform: diff
    publication_lag_days: 35

  - code: U6RATE
    name: Total Unemployed Plus Marginally Attached Plus Part Time for Economic Reasons
    frequency: monthly
    category: labor_market
    transform: diff
    publication_lag_days: 35

  - code: IC4WSA
    name: 4-Week Moving Average of Initial Claims Seasonally Adjusted
    frequency: weekly
    category: labor_market
    transform: log_diff
    publication_lag_days: 5

  - code: TEMPHELPS
    name: Temporary Help Services Payrolls
    frequency: monthly
    category: labor_market
    transform: log_diff
    publication_lag_days: 35

  - code: AWHAETP
    name: Average Weekly Hours of All Employees Total Private
    frequency: monthly
    category: labor_market
    transform: diff
    publication_lag_days: 35

  # Production & Activity
  - code: INDPRO
    name: Industrial Production Index
    frequency: monthly
    category: production_activity
    transform: log_diff
    publication_lag_days: 17

  - code: TCU
    name: Capacity Utilization Total Industry
    frequency: monthly
    category: production_activity
    transform: diff
    publication_lag_days: 17

  - code: CFNAI
    name: Chicago Fed National Activity Index
    frequency: monthly
    category: production_activity
    transform: none
    publication_lag_days: 24

  - code: W875RX1
    name: Real Personal Income Excluding Current Transfer Receipts
    frequency: monthly
    category: production_activity
    transform: log_diff
    publication_lag_days: 30

  - code: RSXFS
    name: Advance Retail Sales Excluding Food Services
    frequency: monthly
    category: production_activity
    transform: log_diff
    publication_lag_days: 15

  - code: CMRMTSPL
    name: Real Manufacturing and Trade Industries Sales
    frequency: monthly
    category: production_activity
    transform: log_diff
    publication_lag_days: 45

  - code: IPMAN
    name: Industrial Production Manufacturing
    frequency: monthly
    category: production_activity
    transform: log_diff
    publication_lag_days: 17

  - code: IPMANSICS
    name: Industrial Production SIC Manufacturing
    frequency: monthly
    category: production_activity
    transform: log_diff
    publication_lag_days: 17

  # High-frequency activity proxies (M1)
  - code: WEI
    name: Weekly Economic Index (NY Fed)
    frequency: weekly
    category: production_activity
    transform: none
    publication_lag_days: 10

  # Diffusion / survey indicators (M2)
  - code: GACDISA066MSFRBNY
    name: Empire State Manufacturing Survey General Business Conditions
    frequency: monthly
    category: production_activity
    transform: none
    publication_lag_days: 1

  - code: GACDFSA066MSFRBPHI
    name: Philadelphia Fed Manufacturing Business Outlook Diffusion Index
